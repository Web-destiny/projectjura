server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/dzhura-security.conf;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/dzhura-security.conf;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/dzhura-security.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/dzhura-security.conf;
    }
}
